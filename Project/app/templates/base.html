<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Developer Contribution Visualizer{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='9' width='4' height='6' rx='1' fill='%232a78d6'/%3E%3Crect x='6' y='5' width='4' height='10' rx='1' fill='%23eb6834'/%3E%3Crect x='11' y='1' width='4' height='14' rx='1' fill='%231baf7a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body {% block body_attrs %}{% endblock %}>
  <header class="topbar">
    <a class="brand" href="{{ url_for('pages.home') }}">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      Contribution Visualizer
    </a>
    <nav class="crumbs">{% block crumbs %}{% endblock %}</nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Developer Contribution Visualizer · reads history with <code>git log</code>, stores it in SQLite</footer>
  <script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
